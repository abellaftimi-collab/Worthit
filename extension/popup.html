<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body{width:300px;margin:0;padding:18px;background:#0c0716;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;}
  h1{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 4px;}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);box-shadow:0 0 10px rgba(167,139,250,.8);}
  .sub{font-size:11px;color:rgba(255,255,255,.45);margin:0 0 16px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:13px;}
  .switch{position:relative;width:38px;height:21px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.15);transition:.25s;cursor:pointer;}
  .slider:before{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.25s;}
  input:checked + .slider{background:linear-gradient(135deg,#a78bfa,#7c3aed);}
  input:checked + .slider:before{transform:translateX(17px);}
  label.lbl{color:rgba(255,255,255,.8);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px;}
  .chip{display:inline-flex;align-items:center;gap:5px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4);color:#cbb8ff;font-size:11.5px;padding:4px 10px;border-radius:99px;}
  .chip button{background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:12px;line-height:1;}
  .add-row{display:flex;gap:6px;margin-bottom:14px;}
  input[type=text],input[type=number],input[type=password]{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:9px;color:#fff;font-size:12.5px;padding:8px 10px;outline:none;flex:1;min-width:0;font-family:inherit;}
  input:focus{border-color:rgba(167,139,250,.6);}
  /* Carte "réglage avancé" pour regrouper le mode strict, dans la charte de l'appli. */
  .card{background:linear-gradient(165deg,rgba(167,139,250,.08),rgba(124,58,237,.04));border:1px solid rgba(167,139,250,.22);border-radius:14px;padding:14px;margin:16px 0 12px;}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .card-head .lock{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#fbcd6b,#e4a11b);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .card-head .t{font-size:12.5px;font-weight:700;color:#fff;}
  .card .row{margin-bottom:0;}
  .pin-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);}
  .pin-row label{font-size:12.5px;color:rgba(255,255,255,.7);flex-shrink:0;}
  .pin-row input{flex:1;text-align:center;letter-spacing:.3em;font-size:14px;}
  .card .foot{margin-top:11px;text-align:left;line-height:1.55;}
  .btn{background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:9px;color:#fff;font-size:12px;font-weight:700;padding:8px 12px;cursor:pointer;font-family:inherit;}
  .price-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,.7);margin-bottom:16px;}
  .price-row input{width:64px;flex:none;text-align:right;}
  .foot{font-size:10.5px;color:rgba(255,255,255,.35);text-align:center;margin:0;}
  .foot a{color:#a78bfa;text-decoration:none;}
  .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);margin:14px 0 6px;}
</style>
</head>
<body>
  <!-- Les libellés sont remplis par popup.js depuis i18n.js : data-i18n = texte,
       data-i18n-ph = placeholder. Le HTML ne porte plus aucune phrase en dur. -->
  <h1><span class="dot"></span>worthit</h1>
  <p class="sub" data-i18n="p.sub"></p>

  <div class="row">
    <label class="lbl" for="enabled" data-i18n="p.enabled"></label>
    <span class="switch"><input type="checkbox" id="enabled" checked><span class="slider"></span></span>
  </div>
  <div class="row">
    <label class="lbl" for="pauseAll" data-i18n="p.pauseAll"></label>
    <span class="switch"><input type="checkbox" id="pauseAll" checked><span class="slider"></span></span>
  </div>
  <div class="row">
    <label class="lbl" for="hideResults" data-i18n="p.hideResults"></label>
    <span class="switch"><input type="checkbox" id="hideResults" checked><span class="slider"></span></span>
  </div>
  <div class="row">
    <label class="lbl" for="blockSearch" data-i18n="p.blockSearch"></label>
    <span class="switch"><input type="checkbox" id="blockSearch" checked><span class="slider"></span></span>
  </div>
  <div class="row">
    <label class="lbl" for="blockSites"><span data-i18n="p.blockSites"></span><br><small style="opacity:.55;" data-i18n="p.blockSitesHint"></small></label>
    <span class="switch"><input type="checkbox" id="blockSites" checked><span class="slider"></span></span>
  </div>

  <p class="h" data-i18n="p.keywords"></p>
  <div class="chips" id="chips"></div>
  <div class="add-row">
    <input type="text" id="kw" data-i18n-ph="p.kwPh">
    <button class="btn" id="add" data-i18n="p.block"></button>
  </div>

  <p class="h" data-i18n="p.priceTitle"></p>
  <div class="price-row">
    <span data-i18n="p.pauseAbove"></span>
    <input type="number" id="priceLimit" min="0" placeholder="0">
    <span>€</span>
  </div>

  <p class="h" data-i18n="p.timerTitle"></p>
  <div class="price-row">
    <span data-i18n="p.wait"></span>
    <input type="number" id="pauseSeconds" min="0" max="600" placeholder="60">
    <span data-i18n="p.sec"></span>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="lock"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <span class="t" data-i18n="p.strictTitle"></span>
    </div>
    <div class="row">
      <label class="lbl" for="strictMode" data-i18n="p.strictToggle"></label>
      <span class="switch"><input type="checkbox" id="strictMode"><span class="slider"></span></span>
    </div>
    <div class="pin-row">
      <label for="pin" data-i18n="p.code"></label>
      <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="••••">
    </div>
    <p class="foot" data-i18n="p.strictFoot"></p>
  </div>

  <p class="foot"><span data-i18n="p.tip"></span> <a href="https://worthit-bi9e.onrender.com" target="_blank">Worthit</a></p>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
